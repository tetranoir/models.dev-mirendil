name: Sync Upstream and Publish

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish a patch even when snapshot data is unchanged"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: mirendil-upstream-sync-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  sync-test-publish:
    if: github.repository == 'tetranoir/models.dev-mirendil'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fast-forward from upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/models.dev.git
          git fetch --no-tags upstream dev
          if ! git merge-base --is-ancestor HEAD upstream/dev; then
            echo "Mirror contains commits absent from upstream; merge upstream to preserve Mirendil changes."
          fi
          git merge --no-edit upstream/dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SDK catalog and types
        run: bun run generate
        working-directory: packages/sdk

      - name: Validate catalog
        run: bun validate

      - name: Test Mirendil mapping contract
        run: >-
          bun test packages/core/test/generate.test.ts
          --test-name-pattern 'base_model preserves|provider JSON preserves'

      - name: Test SDK
        run: bun run test
        working-directory: packages/sdk

      - name: Build SDK
        run: bun run build
        working-directory: packages/sdk

      - name: Commit refreshed SDK types
        run: |
          set -euo pipefail
          status=$(git status --porcelain)
          if [ -n "$status" ] && [ "$status" != " M packages/sdk/src/generated.ts" ]; then
            echo "Unexpected uncommitted files; refusing to commit or publish."
            git status --short
            exit 1
          fi
          if [ -n "$status" ]; then
            git add -- packages/sdk/src/generated.ts
            git commit -m "chore(sdk): refresh generated model families"
          fi

      - name: Push synchronized dev branch
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tests generated uncommitted files; refusing to publish."
            git status --short
            exit 1
          fi
          git push origin dev

      - name: Publish changed snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
          FORCE_PUBLISH: ${{ inputs.force_publish || false }}
        run: |
          args=(--bump=patch)
          if [ "$FORCE_PUBLISH" != "true" ]; then
            args+=(--if-changed)
          fi
          bun script/publish.ts "${args[@]}"
        working-directory: packages/sdk
